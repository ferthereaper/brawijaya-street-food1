
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun | Brawijaya Street Food</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="auth-body">

    <header class="bn auth-header">
        <a href="../index.html" class="bn-brand">
            <span class="ic" aria-hidden="true">🍽️</span>
            Brawijaya Street Food
        </a>
        <a href="../index.html" class="bn-back">
            <span class="ic" aria-hidden="true">←</span> Kembali
        </a>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-icon">
                <span class="ic" aria-hidden="true">👤</span>
            </div>

            <h1>Buat Akun Baru</h1>
            <p class="auth-description">
                Daftar untuk menikmati layanan Brawijaya Street Food.
            </p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="nama"><span class="ic" aria-hidden="true">👤</span> Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
                </div>

                <div class="form-group">
                    <label for="email"><span class="ic" aria-hidden="true">✉️</span> Email</label>
                    <input type="email" id="email" name="email" placeholder="nama@email.com" required>
                </div>

                <div class="form-group">
                    <label for="username"><span class="ic" aria-hidden="true">@</span> Username</label>
                    <input type="text" id="username" name="username" placeholder="Buat username" required>
                </div>

                <div class="form-group">
                    <label for="password"><span class="ic" aria-hidden="true">🔒</span> Password</label>
                    <input type="password" id="password" name="password" placeholder="Minimal 8 karakter" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="konfirmasi"><span class="ic" aria-hidden="true">🛡️</span> Konfirmasi Password</label>
                    <input type="password" id="konfirmasi" name="konfirmasi" placeholder="Ulangi password" minlength="8" required>
                </div>

                <button type="submit" class="auth-submit">
                    <span class="ic" aria-hidden="true">✔️</span> Daftar Sekarang
                </button>

                <p id="registerMessage" class="auth-message" role="status"></p>
            </form>

            <div class="auth-divider"><span>atau</span></div>

            <a href="../pembeli/lapak-guest.html" class="auth-guest">
                <span class="ic" aria-hidden="true">🏪</span> Lihat Menu sebagai Tamu
            </a>

            <p class="auth-register">
                Sudah memiliki akun?
                <a href="login.html">Masuk di sini</a>
            </p>
        </section>
    </main>

    <footer class="auth-footer">
        <p>&copy; 2026 Brawijaya Street Food</p>
        <p><span class="ic" aria-hidden="true">📍</span> Klojen, Kota Malang</p>
    </footer>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const konfirmasi = document.getElementById("konfirmasi").value;
            const message = document.getElementById("registerMessage");

            if (password !== konfirmasi) {
                message.textContent = "Konfirmasi password tidak sama.";
                return;
            }

            message.textContent =
                "Validasi formulir berhasil. Penyimpanan akun belum terhubung ke backend.";
        });
    </script>

</body>
</html>
